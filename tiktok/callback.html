<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>TikTok authorization · Elementary Watson</title>
  <link rel="icon" href="../favicon.png">
  <link rel="stylesheet" href="../style.css">
  <style>
    code { display: block; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px;
           word-break: break-all; font-size: 0.95rem; color: var(--paper); }
    button { margin-top: 12px; padding: 10px 18px; border: 0; border-radius: 10px; cursor: pointer;
             background: var(--accent); color: var(--bg); font: inherit; font-weight: 500; }
    .error { color: #f0a08a; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="../"><img src="../logo.png" alt="">Elementary Watson</a>
  </header>
  <main>
    <h1>TikTok authorization</h1>
    <div id="result" class="card"><p>Reading the response from TikTok…</p></div>
    <p class="meta">This page only displays the code returned by TikTok so it can be pasted into the
      Elementary Watson Publisher tool. Nothing is sent or stored. The code is single-use and
      expires within minutes.</p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var box = document.getElementById("result");
      var code = params.get("code");
      var error = params.get("error");
      box.textContent = "";
      if (code) {
        var intro = document.createElement("p");
        intro.textContent = "Authorization granted. Copy this code and paste it in the terminal:";
        var value = document.createElement("code");
        value.textContent = code;
        var copy = document.createElement("button");
        copy.type = "button";
        copy.textContent = "Copy code";
        copy.addEventListener("click", function () {
          navigator.clipboard.writeText(code).then(function () { copy.textContent = "Copied"; });
        });
        var state = document.createElement("p");
        state.className = "meta";
        state.textContent = "State: " + (params.get("state") || "-");
        box.append(intro, value, copy, state);
      } else {
        var message = document.createElement("p");
        message.className = "error";
        message.textContent = error
          ? "TikTok returned an error: " + error + " " + (params.get("error_description") || "")
          : "No authorization code in this URL. Start the flow from the publisher tool.";
        box.append(message);
      }
      // Drop the code from the address bar and browser history.
      window.history.replaceState(null, "", window.location.pathname);
    })();
  </script>
</body>
</html>
